services:
  ente-db:
    image: postgres:15-alpine
    container_name: ente-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ente
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: ente_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ente -d ente_db" ]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - ./db:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: ente-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --address ":3200" --console-address ":3201"
    ports:
      - "3200:3200"
      - "3201:3201"
    volumes:
      - ./data:/data

  minio-provision:
    image: minio/mc
    container_name: ente-minio-provision
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until mc alias set myminio http://minio:3200 minioadmin minioadmin 2>/dev/null; do
        echo 'Waiting for minio...';
        sleep 1;
      done; mc mb -p myminio/b2-eu-cen; exit 0; "

  ente-server:
    image: ghcr.io/ente/server:latest
    container_name: ente-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./museum.yaml:/museum.yaml:ro
    depends_on:
      ente-db:
        condition: service_healthy
